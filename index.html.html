<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voz &amp; Voice Language Center — Voz &amp; Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFBF5;
      --surface: #FFFFFF;
      --surface-soft: #FDF5E8;
      --ink: #1C2331;
      --ink-muted: #525E75;
      --primary: #a90303;
      --primary-hover: #231dc8;
      --primary-soft: #FFEADF;
      --secondary: #0F766E;
      --secondary-soft: #E0F5F2;
      --accent-gold: #000000;
      --border: #0b0b0a;
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 4px 16px rgba(28, 35, 49, 0.05);
      --shadow-md: 0 12px 32px rgba(28, 35, 49, 0.08);
      --max-w: 1140px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Fraunces', Georgia, serif;
      line-height: 1.2;
      letter-spacing: -0.015em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 251, 245, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 74px;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #0f0bf5);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 6px 14px rgba(224, 90, 43, 0.25);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-short {
      font-family: 'Fraunces', serif;
      font-size: 1.15rem;
      color: var(--ink);
      line-height: 1.1;
    }

    .brand-full {
      font-size: 0.75rem;
      color: var(--ink-muted);
      font-weight: 500;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--ink-muted);
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-switcher {
      display: inline-flex;
      align-items: center;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 999px;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(224, 90, 43, 0.28);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      transition: transform 0.18s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(224, 90, 43, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--secondary-soft);
      color: var(--secondary);
      border: 1px solid rgba(15, 118, 110, 0.22);
    }

    .btn-secondary:hover {
      background: #CBECE7;
    }

    .hero {
      padding: 58px 0 48px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.9fr;
      gap: 32px;
      align-items: center;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--secondary-soft);
      color: var(--secondary);
      font-weight: 700;
      font-size: 0.84rem;
      padding: 7px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 4.2vw, 3.25rem);
      color: var(--ink);
      margin-bottom: 16px;
    }

    .hero-lead {
      font-size: 1.08rem;
      color: var(--ink-muted);
      margin-bottom: 24px;
      max-width: 60ch;
    }

    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .mode-helper-box {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 0.9rem;
      color: var(--ink);
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-md);
    }

    .hero-card-title {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .hero-highlights {
      list-style: none;
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .hero-highlights li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.94rem;
      color: var(--ink-muted);
    }

    .dot-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .free-banner {
      background: linear-gradient(120deg, #E0F5F2, #FFF3E0);
      border: 1px solid #C7E8E2;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
    }

    section {
      padding: 54px 0;
    }

    .section-header {
      margin-bottom: 28px;
      max-width: 68ch;
    }

    .section-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .section-header h2 {
      font-size: clamp(1.65rem, 3vw, 2.3rem);
      color: var(--ink);
      margin-bottom: 10px;
    }

    .section-header p {
      color: var(--ink-muted);
      font-size: 1rem;
    }

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .benefit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }

    .benefit-card h3 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .benefit-card p {
      color: var(--ink-muted);
      font-size: 0.94rem;
    }

    .gradual-strip {
      margin-top: 22px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      display: grid;
      gap: 8px;
      font-size: 0.93rem;
    }

    .level-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .level-tab {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--ink);
      padding: 11px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
      transition: all 0.2s ease;
    }

    .level-tab.active {
      background: var(--secondary);
      border-color: var(--secondary);
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(15, 118, 110, 0.22);
    }

    .syllabus-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-md);
    }

    .syllabus-top {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 22px;
    }

    .syllabus-top h3 {
      font-size: clamp(1.35rem, 2.4vw, 1.85rem);
      color: var(--ink);
    }

    .syllabus-sub {
      color: var(--ink-muted);
      font-size: 1rem;
    }

    .meta-bar {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .meta-chip {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.84rem;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .syllabus-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .sub-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .sub-panel h4 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .clean-list {
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .clean-list li {
      font-size: 0.92rem;
      color: var(--ink-muted);
      padding-left: 14px;
      position: relative;
    }

    .clean-list li::before {
      content: "•";
      color: var(--primary);
      font-weight: 700;
      position: absolute;
      left: 0;
    }

    .clean-list strong {
      color: var(--ink);
    }

    .vocab-box {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 22px;
    }

    .vocab-box h4 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }

    .vocab-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.88rem;
    }

    .vocab-item strong {
      display: block;
      color: var(--secondary);
      margin-bottom: 4px;
    }

    .vocab-item span {
      color: var(--ink-muted);
    }

    .syllabus-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .pricing-note {
      background: var(--secondary-soft);
      border: 1px solid #BFE6E0;
      color: var(--ink);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 22px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
    }

    .price-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .price-card h3 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .price-duration {
      font-size: 0.85rem;
      color: var(--ink-muted);
      margin-bottom: 14px;
    }

    .rate-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 10px;
    }

    .rate-label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--secondary);
      letter-spacing: 0.04em;
    }

    .rate-main {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--ink);
      margin-top: 2px;
    }

    .rate-sub {
      font-size: 0.88rem;
      color: var(--ink-muted);
    }

    .free-tag {
      display: inline-block;
      margin-top: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: start;
    }

    .contact-form-card,
    .contact-info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-sm);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #FFFFFF;
    }

    .form-feedback {
      margin-top: 16px;
      background: var(--surface-soft);
      border: 1.5px solid var(--secondary);
      border-radius: var(--radius-md);
      padding: 16px;
      color: var(--ink);
      font-size: 0.92rem;
    }

    .contact-list {
      list-style: none;
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }

    .contact-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.92rem;
    }

    .contact-item strong {
      display: block;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .contact-item a {
      color: var(--secondary);
      font-weight: 600;
      word-break: break-word;
    }

    .contact-item a:hover {
      text-decoration: underline;
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 36px 0;
      margin-top: 32px;
    }

    .footer-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .footer-meta {
      font-size: 0.86rem;
      color: var(--ink-muted);
    }

    @media (max-width: 900px) {
      .hero-grid,
      .syllabus-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        display: none;
      }
      .nav-links {
        display: none;
      }
    }

    .brand-img {
      height: 120px;
      width: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav-wrap">
      <a href="#top" class="brand-logo" aria-label="Voz & Voice Language Center">
        <img src="c:\Users\amner\Desktop\voz&voice\Logo Vand V.jpg" alt="Voz & Voice" class="brand-img" />
        <span class="brand-text">
          <span class="brand-short">Voz &amp; Voice</span>
          <span class="brand-full">Voz &amp; Voice Language Center</span>
        </span>
      </a>

      <nav class="nav-links" aria-label="Primary navigation">
        <a href="#why-speaking" id="navWhy"></a>
        <a href="#syllabus" id="navSyllabus"></a>
        <a href="#pricing" id="navPricing"></a>
        <a href="#contact" id="navContact"></a>
        <a href="#methodology" id="navMethodology"></a>
      </nav>

      <div class="nav-actions">
        <div class="lang-switcher" role="group" aria-label="Language switcher">
          <button type="button" class="lang-btn" id="btnES" onclick="setLanguage('es')">ES</button>
          <button type="button" class="lang-btn active" id="btnEN" onclick="setLanguage('en')">EN</button>
        </div>
        <a href="#contact" class="btn btn-primary" id="navCtaBtn"></a>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <div class="pill-badge" id="heroBadge"></div>
          <h1 id="heroTitle"></h1>
          <p class="hero-lead" id="heroSubtitle"></p>

          <div class="hero-cta-group">
            <a href="#contact" class="btn btn-primary" id="heroPrimaryCta"></a>
            <a href="#syllabus" class="btn btn-secondary" id="heroSecondaryCta"></a>
          </div>

          <div class="mode-helper-box" id="modeHelperBox"></div>
        </div>

        <aside class="hero-card">
          <h2 class="hero-card-title" id="heroCardTitle"></h2>
          <ul class="hero-highlights" id="heroHighlights"></ul>
          <div class="free-banner" id="heroFreeBanner"></div>
        </aside>
      </div>
    </section>

    <section id="why-speaking">
      <div class="container">
        <div class="section-header">
          <span class="section-tag" id="whyTag"></span>
          <h2 id="whyTitle"></h2>
          <p id="whyDesc"></p>
        </div>

        <div class="benefits-grid" id="benefitsGrid"></div>
        <div class="gradual-strip" id="gradualStrip" style="display: none;"></div>
      </div>
    </section>

    <section id="syllabus">
      <div class="container">
        <div class="section-header">
          <span class="section-tag" id="syllabusTag"></span>
          <h2 id="syllabusTitle"></h2>
          <p id="syllabusDesc"></p>
        </div>

        <div class="level-tabs" role="tablist" aria-label="Course levels">
          <button type="button" class="level-tab active" id="tab-a1a2" onclick="selectLevel('a1a2')">A1–A2</button>
          <button type="button" class="level-tab" id="tab-b1b2" onclick="selectLevel('b1b2')">B1–B2</button>
          <button type="button" class="level-tab" id="tab-c1c2" onclick="selectLevel('c1c2')">C1–C2</button>
        </div>

        <article class="syllabus-card" id="syllabusCard"></article>
      </div>
    </section>

    <section id="pricing">
      <div class="container">
        <div class="section-header">
          <span class="section-tag" id="pricingTag"></span>
          <h2 id="pricingTitle"></h2>
          <p id="pricingDesc"></p>
        </div>

        <div class="pricing-note" id="pricingRegistrationBanner"></div>
        <div class="pricing-grid" id="pricingGrid"></div>
      </div>
    </section>

    <section id="contact">
      <div class="container">
        <div class="section-header">
          <span class="section-tag" id="contactTag"></span>
          <h2 id="contactTitle"></h2>
          <p id="contactDesc"></p>
        </div>

        <div class="contact-grid">
          <form class="contact-form-card" id="inquiryForm" onsubmit="handleInquirySubmit(event)">
            <div class="form-group">
              <label for="studentName" id="lblName"></label>
              <input type="text" id="studentName" required />
            </div>

            <div class="form-group">
              <label for="studentEmail" id="lblEmail"></label>
              <input type="email" id="studentEmail" required />
            </div>

            <div class="form-group">
              <label for="studentPhone" id="lblPhone"></label>
              <input type="tel" id="studentPhone" required />
            </div>

            <div class="form-group">
              <label for="studentLevel" id="lblLevel"></label>
              <select id="studentLevel">
                <option value="A1–A2">A1–A2</option>
                <option value="B1–B2">B1–B2</option>
                <option value="C1–C2">C1–C2</option>
              </select>
            </div>

            <div class="form-group">
              <label for="studentMessage" id="lblMessage"></label>
              <textarea id="studentMessage" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn"></button>
            <div class="form-feedback" id="formFeedback" style="display: none;"></div>

    async function handleInquirySubmit(event) {
  event.preventDefault();
  const NUEVA_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYwhVcdohD8fzRG5cPGGh7AnULYFYBJl48IGadhg5402BIt8vGPLF5NVSUEMvN5bc4/exec";
  const d = DATA[currentLang];
  const name = document.getElementById("studentName").value.trim();
  const email = document.getElementById("studentEmail").value.trim();
  const phoneEl = document.getElementById("studentPhone");
  const phone = phoneEl ? phoneEl.value.trim() : "";
  const level = document.getElementById("studentLevel").value;
  const msg = document.getElementById("studentMessage").value.trim();
  const fb = document.getElementById("formFeedback");

  try {
    await fetch(NUEVA_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name, email, phone, level, question: msg })
    });
  } catch (err) {
    console.error(err);
  }

  event.target.reset();

  const confirmedMsg = currentLang === "en"
    ? "Confirmed! Your information has been sent."
    : "¡Confirmado! Tu información ha sido enviada.";

  fb.style.display = "block";
  fb.innerHTML = `
    <strong>${confirmedMsg}</strong>
    <div style="margin-top: 8px; font-size: 0.88rem; color: var(--ink-muted);">
      ${d.contact.feedbackHtml}
    </div>
  `;
}
